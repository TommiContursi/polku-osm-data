name: Polku OSM data
run-name: OSM data / ${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.event.schedule == '17 3 * * 1' && 'build' || 'check' }}

# Builds and checks the data, and uploads a candidate that Polku's own weekly job checks with the app and promotes.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access, build, inspect or resume a verified build's upload, or check the live release
        type: choice
        options: [verify-access, inspect-retention, test-host, build, geometry-candidate, upload-existing, inspect-existing, resume-existing, check]
        default: verify-access
      release:
        description: Source run ID to upload again, or to build optional geometry
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('osm-data-pr-{0}', github.event.pull_request.number) || inputs.operation == 'geometry-candidate' && 'osm-geometry-candidate' || 'osm-data' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned data dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt -r tools/osm_data/sftp-requirements.txt
      - name: BRouter 1.7.10's own release, pinned, for the routing mirror's check
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 300 -o brouter.zip https://github.com/abrensch/brouter/releases/download/v1.7.10/brouter-1.7.10.zip
          echo '023fec3ba997758e8cd7ab9e1bae52e962af3f00b57683e3de86b84ffad01532  brouter.zip' | sha256sum --check
          unzip -q -j brouter.zip brouter-1.7.10/brouter-1.7.10-all.jar -d brouter
      - name: Test extraction, reading and publishing without credentials
        env:
          BROUTER_JAR: brouter/brouter-1.7.10-all.jar
        run: |
          python -m unittest discover -s tools/osm_data -p 'test_*.py' -v

  verify-access:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'verify-access' || inputs.operation == 'inspect-retention')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Verify credentials and directory without uploading
        env:
          OSM_OPERATION: ${{ inputs.operation }}
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/publish.py "$OSM_OPERATION"

  test-host:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'test-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Check disposable SFTP transfer, overwrite, rename and public HTTP
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/publish.py test-host

  snapshot:
    if: github.event.schedule == '17 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build' && inputs.release == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stamp: ${{ steps.snapshot.outputs.stamp }}
      source: ${{ steps.snapshot.outputs.source }}
    steps:
      - id: snapshot
        name: Pick a completed dated export shared by all four countries and Europe
        env:
          MIRROR: https://ftp5.gwdg.de/pub/misc/openstreetmap/download.geofabrik.de/
        run: |
          for osm_days in 1 2; do
            osm_stamp=$(date -u -d "$osm_days days ago" +%y%m%d)
            osm_ready=true
            for osm_region in europe/finland europe/sweden europe/norway europe/estonia europe; do
              curl --head --fail --silent --show-error --location \
                --connect-timeout 5 --max-time 8 --retry 2 --retry-connrefused --retry-max-time 15 \
                --output /dev/null --write-out '%{url} HTTP %{http_code} (curl %{exitcode})\n' \
                "https://download.geofabrik.de/$osm_region-$osm_stamp.osm.pbf.md5" || osm_ready=false
            done
            if $osm_ready; then
              echo "stamp=$osm_stamp" >> "$GITHUB_OUTPUT"
              echo 'source=geofabrik' >> "$GITHUB_OUTPUT"
              echo "Source: Geofabrik, dated snapshot $osm_stamp" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # Geofabrik refuses some of GitHub's runner networks (#1). GWDG mirrors Geofabrik's dated Europe export,
          # and only that one file, so the mirror job clips the four countries from it.
          mirror_stamp=$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors --retry-delay 5 "${MIRROR}europe-latest.osm.pbf.md5" \
            | sed -n 's/^[0-9a-f]\{32\} \+europe-\([0-9]\{6\}\)\.osm\.pbf$/\1/p')
          for osm_days in 0 1 2 3; do
            if [ "$mirror_stamp" = "$(date -u -d "$osm_days days ago" +%y%m%d)" ]; then
              echo "stamp=$mirror_stamp" >> "$GITHUB_OUTPUT"
              echo 'source=mirror' >> "$GITHUB_OUTPUT"
              echo "Geofabrik did not answer. Source: the GWDG mirror of Geofabrik, dated snapshot $mirror_stamp," \
                   'with the four countries clipped from its Europe export on the runner.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No completed common country/reference snapshot within two days, and no mirrored Europe export" \
               "within three days (the mirror offered '$mirror_stamp')" >&2
          exit 1

  mirror:
    # Only when Geofabrik refused this run: the mirror holds Europe alone, so the countries are clipped here (#1).
    needs: snapshot
    if: needs.snapshot.outputs.source == 'mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # The mirror keeps the newest export only, under -latest; its MD5 file names the dated export it holds
      SOURCE_URL: https://ftp5.gwdg.de/pub/misc/openstreetmap/download.geofabrik.de/europe-latest.osm.pbf
      SNAPSHOT: ${{ needs.snapshot.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the clipping tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version | head -1
      - name: Download the mirrored Europe export and check its published MD5
        timeout-minutes: 185
        run: |
          mkdir -p osm-build
          df -h .
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 45 * 1024**3, "Clipping the Europe export requires 45 GiB free disk"'
          # The same resumable transfer the geometry job uses: curl's own --retry would start again from nothing.
          deadline=$((SECONDS + 10800)) have=0 idle=0
          until curl --fail --location --continue-at - --connect-timeout 30 --speed-limit 1000000 --speed-time 300 \
              --max-time $((deadline - SECONDS)) "$SOURCE_URL" -o osm-build/europe.osm.pbf; do
            size=0; [ ! -f osm-build/europe.osm.pbf ] || size=$(($(wc -c < osm-build/europe.osm.pbf)))
            if [ "$size" -gt "$have" ]; then idle=0; else idle=$((idle + 1)); fi
            have=$size
            if [ "$idle" -ge 4 ] || [ $((deadline - SECONDS)) -lt 120 ]; then echo "The Europe export stopped at $have bytes"; exit 1; fi
            echo "Going on from $have bytes"; sleep 30
          done
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 60 "$SOURCE_URL.md5" -o osm-build/europe.md5
          cat osm-build/europe.md5
          grep -q "  europe-$SNAPSHOT\.osm\.pbf\$" osm-build/europe.md5 || { echo "The mirror now holds another export than $SNAPSHOT" >&2; exit 1; }
          (cd osm-build && sed "s/  .*/  europe.osm.pbf/" europe.md5 | md5sum --check --strict -)
          df -h .
      - name: Clip the four countries in one pass, keeping the export's replication timestamp
        run: |
          stamp=$(osmium fileinfo -g header.option.osmosis_replication_timestamp osm-build/europe.osm.pbf)
          echo "The mirrored export was made from OSM at $stamp"
          mkdir -p osm-build/extracts
          cat > osm-build/extracts.json <<'JSON'
          {"directory": "osm-build/extracts", "extracts": [
            {"output": "finland.osm.pbf", "polygon": {"file_name": "data/finland.poly", "file_type": "poly"}},
            {"output": "sweden.osm.pbf", "polygon": {"file_name": "data/sweden.poly", "file_type": "poly"}},
            {"output": "norway.osm.pbf", "polygon": {"file_name": "data/norway.poly", "file_type": "poly"}},
            {"output": "estonia.osm.pbf", "polygon": {"file_name": "data/estonia.poly", "file_type": "poly"}}]}
          JSON
          /usr/bin/time -v osmium extract -c osm-build/extracts.json --strategy complete_ways \
            --output-header="osmosis_replication_timestamp=$stamp" --overwrite osm-build/europe.osm.pbf
          rm osm-build/europe.osm.pbf
          for country in finland sweden norway estonia; do
            mkdir -p "osm-build/clipped/$country"
            mv "osm-build/extracts/$country.osm.pbf" "osm-build/clipped/$country/source.osm.pbf"
            (cd "osm-build/clipped/$country" && md5sum source.osm.pbf > source.md5)
            echo "osmium $(osmium --version | head -1 | cut -d' ' -f3) extract --strategy complete_ways" \
              > "osm-build/clipped/$country/clipped-with.txt"
            echo "$SOURCE_URL" > "osm-build/clipped/$country/source-url.txt"
          done
          ls -l osm-build/clipped/*
          df -h .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-mirror-finland
          path: osm-build/clipped/finland
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-mirror-sweden
          path: osm-build/clipped/sweden
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-mirror-norway
          path: osm-build/clipped/norway
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-mirror-estonia
          path: osm-build/clipped/estonia
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  build:
    needs: [snapshot, mirror]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && needs.mirror.result != 'failure' && (github.event.schedule == '17 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build' && inputs.release == '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        country: [finland, sweden, norway, estonia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Build dependencies and checks
        run: |
          python -m pip install --require-hashes -r tools/osm_data/requirements.txt -r tools/osm_data/sftp-requirements.txt
          python -m unittest discover -s tools/osm_data -p 'test_*.py' -v
      - name: Take the country the mirror job clipped, when Geofabrik refused this run
        if: needs.snapshot.outputs.source == 'mirror'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: osm-mirror-${{ matrix.country }}
          path: osm-build
      - name: Download one complete country and its checksum
        if: needs.snapshot.outputs.source == 'geofabrik'
        timeout-minutes: 40
        env:
          COUNTRY: ${{ matrix.country }}
          SNAPSHOT: ${{ needs.snapshot.outputs.stamp }}
        run: |
          mkdir -p osm-build
          df -h .
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 25 * 1024**3, "Complete OSM country builds require 25 GiB free disk"'
          # Geofabrik is moving countries into folders of their own: the checksum comes from beside the file served (#1151)
          source=$(curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --retry-max-time 300 --connect-timeout 30 --max-time 1800 --write-out '%{url_effective}' "https://download.geofabrik.de/europe/$COUNTRY-$SNAPSHOT.osm.pbf" -o osm-build/source.osm.pbf)
          echo "Downloaded $source"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 60 "$source.md5" -o osm-build/source.md5
      - name: Transform, validate and measure
        env:
          COUNTRY: ${{ matrix.country }}
          SNAPSHOT: ${{ needs.snapshot.outputs.stamp }}
          SOURCE: ${{ needs.snapshot.outputs.source }}
        run: |
          # The clipping polygons are this repository's copies of Geofabrik's, so no build waits on Geofabrik for them (#1)
          set --
          if [ "$SOURCE" = mirror ]; then
            set -- --source-url "$(cat osm-build/source-url.txt)" --clipped-with "$(cat osm-build/clipped-with.txt)"
          fi
          /usr/bin/time -v python tools/osm_data/builder.py osm-build/source.osm.pbf osm-build/release --md5 osm-build/source.md5 --country "$COUNTRY" --coverage "data/$COUNTRY.poly" --snapshot "$SNAPSHOT" "$@"
          df -h .
      - name: Build measurements
        if: always()
        run: |
          if test -f osm-build/release/measurements.json; then
            echo '### Country OSM build' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat osm-build/release/measurements.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain small measurements and manifest independently of archives
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-${{ matrix.country }}-evidence
          path: |
            osm-build/release/measurements.json
            osm-build/release/manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain small geometry inputs without copying country archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-${{ matrix.country }}-geometry-inputs
          path: |
            osm-build/release/manifest.json
            osm-build/release/identities.jsonl.gz
            osm-build/release/geometry-roots.jsonl.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-${{ matrix.country }}-release
          path: osm-build/release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-${{ matrix.country }}-source
          path: |
            osm-build/source.osm.pbf
            osm-build/source.md5
          compression-level: 0
          retention-days: 14

  geometry:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'geometry-candidate')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt
      - name: Select the current or a verified completed country run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.release }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PYCODE'
          import json,os,re,subprocess
          from tools.osm_data.publish import recovery_countries,require
          source,repo=os.environ.get('SOURCE_RUN',''),os.environ['GITHUB_REPOSITORY']
          selected=os.environ['GITHUB_RUN_ID']
          if os.environ['OPERATION']=='geometry-candidate':
              require(re.fullmatch('[0-9]+',source),'Enter the numeric source build run ID from Actions')
              def read(path):
                  return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/'+source+path]))
              selected=recovery_countries(repo,read(''),read('/jobs?filter=all&per_page=100')['jobs'],read('/artifacts?per_page=100')['artifacts'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('run_id='+selected+'\n')
          print('Country artifact source run: '+selected)
          PYCODE
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: osm-*-geometry-inputs
          path: osm-build/inputs
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Derive one dated reference, from the same source as the country inputs
        id: reference
        run: |
          python - <<'PYCODE'
          import os,re
          from pathlib import Path
          from tools.osm_data.builder import GEOFABRIK, source_kind
          from tools.osm_data.geometry_source import load_inputs
          inputs=load_inputs(sorted(Path('osm-build/inputs').glob('osm-*-geometry-inputs')))
          stamps=[re.search(r'-([0-9]{6})\.osm\.pbf$',m['source']['url']) for _,m in inputs.values()]
          assert all(stamps) and len({s[1] for s in stamps})==1,'One common dated country snapshot is required'
          country,(_,first)=next(iter(sorted(inputs.items())))
          # The mirror's countries were clipped from the very export the geometry needs, so its URL carries over
          url=(first['source']['url'] if source_kind(first['source'],country)=='mirror'
               else GEOFABRIK+'europe-'+stamps[0][1]+'.osm.pbf')
          print('Reference source: '+url)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('stamp='+stamps[0][1]+'\nurl='+url+'\n')
          PYCODE
      - name: Check actual disk against the dated reference size and staging reserve
        env:
          SOURCE_URL: ${{ steps.reference.outputs.url }}
        run: |
          df -h .
          SOURCE_BYTES=$(curl --head --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 30 --output /dev/null --write-out '%header{content-length}' "$SOURCE_URL")
          export SOURCE_BYTES
          python - <<'PYCODE'
          import json,os,shutil
          size=int(os.environ['SOURCE_BYTES'] or 0)
          free=shutil.disk_usage('.').free
          print(json.dumps({'source_bytes':size,'free_bytes':free,'staging_reserve_bytes':25*1024**3}))
          assert size>0 and free>=size+25*1024**3, 'Insufficient reference download/staging disk on this runner'
          PYCODE
      - name: Download dated reference and checksum
        timeout-minutes: 185
        env:
          SOURCE_URL: ${{ steps.reference.outputs.url }}
        run: |
          # The 35 GB export has taken 42 minutes to over 2 hours, so a stopped or stalled transfer goes on from where it
          # stopped, on a new connection, within 3 hours. curl's own --retry would start again from nothing. Four tries in a
          # row that add no bytes end it, so a refused runner still fails soon and is re-run on a new one (#1043).
          deadline=$((SECONDS + 10800)) have=0 idle=0
          until source=$(curl --fail --location --continue-at - --connect-timeout 30 --speed-limit 1000000 --speed-time 300 --max-time $((deadline - SECONDS)) --write-out '%{url_effective}' "$SOURCE_URL" -o osm-build/europe.osm.pbf); do
            size=0; [ ! -f osm-build/europe.osm.pbf ] || size=$(($(wc -c < osm-build/europe.osm.pbf)))
            if [ "$size" -gt "$have" ]; then idle=0; else idle=$((idle + 1)); fi
            have=$size
            if [ "$idle" -ge 4 ] || [ $((deadline - SECONDS)) -lt 120 ]; then echo "The Europe export stopped at $have bytes"; exit 1; fi
            echo "Going on from $have bytes"; sleep 30
          done
          echo "Downloaded $source"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 60 "$source.md5" -o osm-build/europe.md5
          df -h .
      - name: Complete original references and compile local geometry
        env:
          SNAPSHOT: ${{ steps.reference.outputs.stamp }}
          SOURCE_URL: ${{ steps.reference.outputs.url }}
        run: |
          /usr/bin/time -v python -m tools.osm_data.geometry_source osm-build/europe.osm.pbf osm-build/geometry osm-build/inputs/osm-finland-geometry-inputs osm-build/inputs/osm-sweden-geometry-inputs osm-build/inputs/osm-norway-geometry-inputs osm-build/inputs/osm-estonia-geometry-inputs --md5 osm-build/europe.md5 --snapshot "$SNAPSHOT" --source-url "$SOURCE_URL" --remove-source
          test ! -f osm-build/europe.osm.pbf
          df -h .
      - name: Geometry measurements
        if: always()
        run: |
          df -h .
          if test -f osm-build/geometry/measurements.json; then
            echo '### Shared OSM geometry build' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat osm-build/geometry/measurements.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: osm-geometry-evidence
          path: |
            osm-build/geometry/manifest.json
            osm-build/geometry/measurements.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: osm-shared-geometry
          path: osm-build/geometry/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  bundle:
    needs: geometry
    if: ${{ !cancelled() && needs.geometry.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt
      - name: Check measured assembly disk budget
        run: python -c 'import shutil; assert shutil.disk_usage(".").free >= 25 * 1024**3, "OSM candidate assembly requires 25 GiB free disk"'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: osm-*-release
          path: osm-build/countries
          github-token: ${{ github.token }}
          run-id: ${{ needs.geometry.outputs.run_id }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: osm-shared-geometry
          path: osm-build/geometry
      - name: Validate source epoch and all overlapping original object identities
        run: |
          python -m tools.osm_data.bundle osm-build/release osm-build/countries/osm-finland-release osm-build/countries/osm-sweden-release osm-build/countries/osm-norway-release osm-build/countries/osm-estonia-release --geometry osm-build/geometry
          df -h .
      - name: Check every country's sample roads in the combined release
        run: |
          python - <<'PY' > osm-build/sample-validation.json
          import json
          from pathlib import Path
          from tools.osm_data.builder import COUNTRIES, COUNTRY_SAMPLES, validate_archive
          from tools.osm_data.publish import local_release
          root = Path('osm-build/release')
          _, manifest = local_release(root)
          results = {}
          for country in COUNTRIES:
              records = [d for d in manifest['datasets'].values() if d.get('country') == country and d.get('kind') == 'ways']
              assert len(records) == 1, f'Missing or duplicate ways archive for {country}'
              dataset = records[0]
              samples = COUNTRY_SAMPLES[country]
              rows = validate_archive(root / dataset['url'], dataset['tiles'], samples=samples)
              assert rows and set(rows) == set(samples) and all(row['ways'] for row in rows.values()), f'Missing sample roads for {country}'
              results[country] = rows
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: osm-four-country-evidence
          path: |
            osm-build/release/manifest.json
            osm-build/release/measurements.json
            osm-build/sample-validation.json
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nordic-osm-release
          path: osm-build/release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  upload:
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' && vars.OSM_UPLOAD_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build')) }}
    runs-on: ubuntu-24.04
    # A first upload of cells sends some 23,000 files; a stopped one goes on with resume-existing
    timeout-minutes: 350
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: nordic-osm-release
          path: osm-build/release
      - name: Install pinned SFTP dependency (with PMTiles, for the cut into cells)
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Upload, verify and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
          OSM_SHARED_FILES: ${{ vars.OSM_SHARED_FILES }}
          OSM_CELLS: ${{ vars.OSM_CELLS }}
        run: python tools/osm_data/publish.py upload osm-build/release

  upload-existing:
    # Explicit recovery selects a verified main build, including a later upload failure.
    # Does not enable unattended upload or rebuild the archive.
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'upload-existing' || inputs.operation == 'inspect-existing' || inputs.operation == 'resume-existing') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A first upload of cells sends some 23,000 files; a stopped one goes on with resume-existing
    timeout-minutes: 350
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Validate the selected recovery build before downloading
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.release }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from tools.osm_data.publish import recovery_source, require
          source, repo = os.environ['SOURCE_RUN'], os.environ['GITHUB_REPOSITORY']
          require(re.fullmatch('[0-9]+', source), 'Enter the numeric source build run ID from Actions')
          def read(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + source + path]))
          selected = recovery_source(repo, read(''), read('/jobs?filter=all&per_page=100')['jobs'], read('/artifacts?per_page=100')['artifacts'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + selected + '\n')
          print('Verified recovery source: main build ' + selected)
          PY
      - name: Download the verified main four-country build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: nordic-osm-release
          path: osm-build/release
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Install pinned SFTP dependency (with PMTiles, for the cut into cells)
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Inspect, resume or upload the verified OSM release
        env:
          OSM_ALLOW_PUBLISH: ${{ inputs.operation == 'inspect-existing' && 'false' || 'true' }}
          OSM_OPERATION: ${{ inputs.operation }}
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
          OSM_SHARED_FILES: ${{ vars.OSM_SHARED_FILES }}
          OSM_CELLS: ${{ vars.OSM_CELLS }}
        run: |
          case "$OSM_OPERATION" in
            inspect-existing) python tools/osm_data/publish.py inspect osm-build/release ;;
            resume-existing) python tools/osm_data/publish.py upload osm-build/release --resume ;;
            upload-existing) python tools/osm_data/publish.py upload osm-build/release ;;
            *) exit 1 ;;
          esac

  monitor:
    if: (github.event.schedule == '17 7 * * *' && vars.OSM_PUBLIC_URL != '') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Freshness and integrity of the live files (Polku's weekly job checks them in a browser)
        env:
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/publish.py check "$OSM_PUBLIC_URL/current.json"
