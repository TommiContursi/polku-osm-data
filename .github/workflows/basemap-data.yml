name: Polku base map
run-name: Base map / ${{ github.event_name == 'pull_request' && 'test' || inputs.operation || 'copy' }}

# Extracts OpenFreeMap's base map to zoom 14 over the Nordic and Baltic countries, monthly, and uploads a candidate in
# cells. The schedule uploads only while BASEMAP_UPLOAD_ENABLED is true. A pull request that changes the job extracts
# central Helsinki and uploads nothing.
on:
  pull_request:
    paths: [tools/osm_data/basemap.py, tools/osm_data/extract.py, .github/workflows/basemap-data.yml]
  schedule:
    - cron: '43 4 2 * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Install polku-basemap and its .htaccess once, or extract the base map and upload the candidate
        type: choice
        options: [install-hosting, copy]
        default: copy
      box:
        description: West,south,east,north in degrees; a small box tests the whole job
        type: string
        default: '4.0,53.8,31.7,71.3'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('basemap-data-pr-{0}', github.event.pull_request.number) || 'basemap-data' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt
      - name: Extract central Helsinki from OpenFreeMap
        run: python tools/osm_data/basemap.py build release --box 24.92,60.16,24.96,60.18

  host:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-basemap and its .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/basemap.py install-hosting

  copy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'copy' || github.event_name == 'schedule' && vars.BASEMAP_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # 6.23 GB read in runs of 32 MiB, then the cells the host lacks sent and read back one by one
    timeout-minutes: 340
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Extract the base map zoom by zoom and build the release
        env:
          BOX: ${{ inputs.box || '4.0,53.8,31.7,71.3' }}
        run: |
          df -h .
          python tools/osm_data/basemap.py build release --box "$BOX"
          df -h .
      - name: Upload the release in cells and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_CELLS: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/basemap.py upload release
