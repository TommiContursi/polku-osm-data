name: Polku search index
run-name: Search index / ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'update' }}

# Builds the search index from Photon's weekly dump for Finland, NLS's place names and GeoNames' towns, on the newest
# release on the host, and uploads only what changed as a candidate. Its tests run with the others
# in osm-data.yml.
on:
  schedule:
    # Tuesdays: Photon's dump is dated Sunday and published on Monday; away from the OSM upload and the routing update
    - cron: '17 4 * * 2'
  workflow_dispatch:
    inputs:
      operation:
        description: Install polku-search and its .htaccess once, update the index, or make every group's files again
        type: choice
        options: [install-hosting, update, fresh]
        default: update

permissions:
  contents: read

concurrency:
  group: search-data
  cancel-in-progress: false

jobs:
  host:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-search and its .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/search.py install-hosting

  index:
    if: github.event_name == 'schedule' || inputs.operation == 'update' || inputs.operation == 'fresh'
    runs-on: ubuntu-24.04
    # The dump is 250 MB and NLS's names about 80 requests (about 13 minutes), the build about 4; a week sends about 300
    # files, the first release about 14,000 (1.5 s each, 4 at once: about 80 minutes)
    timeout-minutes: 120
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Download Photon's dump, NLS's place names and GeoNames' towns
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
        run: python tools/osm_data/search.py fetch work
      - name: Build the release on the newest one on the host
        env:
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/search.py build work release ${{ inputs.operation == 'fresh' && '--fresh' || '' }}
      - name: Upload what the host lacks and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_SHARED_FILES: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/search.py upload release
