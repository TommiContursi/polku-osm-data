name: Polku NLS background map
run-name: NLS background map / ${{ github.event_name == 'workflow_dispatch' && format('copy {0}', inputs.box) || 'test' }}

# Copies NLS's (MML's) background-map vector tiles once, packs them into PMTiles and uploads a candidate.
on:
  pull_request:
    paths: [tools/osm_data/mml.py, tools/osm_data/mml.htaccess, .github/workflows/mml-data.yml]
  workflow_dispatch:
    inputs:
      box:
        description: West,south,east,north in degrees; a small box tests the whole job
        type: string
        default: '19.0,59.3,31.6,70.1'
      store:
        description: An earlier run's ID, to go on from the tiles it fetched
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mml-data-pr-{0}', github.event.pull_request.number) || 'mml-data' }}
  cancel-in-progress: false

env:
  # A pull request fetches central Helsinki, in two parts, to test going on from a stopped run
  BOX: ${{ inputs.box || '24.92,60.16,24.96,60.18' }}

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # 892,856 tiles at 40 a second is about 6.2 hours: each part stops itself in time to keep what it fetched
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1, 2, 3]') }}
    steps:
      - name: This part's deadline
        run: echo "UNTIL=$(( $(date +%s) + 320 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned data dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt
      - name: The tiles this run has fetched so far
        id: here
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: mml-store
          path: mml
      - name: Or those of the earlier run named
        if: steps.here.outcome == 'failure' && inputs.store
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: mml-store
          path: mml
          github-token: ${{ github.token }}
          run-id: ${{ inputs.store }}
      - name: One tile at each zoom, by hand
        if: matrix.part == 1
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
        run: python tools/osm_data/mml.py sample
      - name: Fetch the tiles not held yet
        id: fetch
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
          LIMIT: ${{ github.event_name == 'pull_request' && matrix.part == 1 && '--limit 10' || '' }}
        run: python tools/osm_data/mml.py fetch mml/store.sqlite --box "$BOX" --until "$UNTIL" $LIMIT
      - name: Keep what was fetched, for the next part or a later run
        # A store from an earlier run is kept in this one even when it was complete, for the pack below
        if: always() && (steps.fetch.outputs.changed == 'true' || (steps.here.outcome == 'failure' && inputs.store))
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mml-store
          path: mml/store.sqlite
          overwrite: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  pack:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned data dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: mml-store
          path: mml
      - name: One archive of every tile, read back tile for tile, with the manifest
        run: python tools/osm_data/mml.py pack mml/store.sqlite mml-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mml-release
          path: mml-release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  upload:
    needs: pack
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/requirements.txt -r tools/osm_data/sftp-requirements.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: mml-release
          path: mml-release
      - name: Upload, read back and name the candidate in polku-mml
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/mml.py upload mml-release
