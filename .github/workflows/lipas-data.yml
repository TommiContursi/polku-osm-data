name: Polku LIPAS
run-name: LIPAS / ${{ inputs.operation }}

# Copies LIPAS's routes and places of the types Polku shows into PMTiles beside the features as served, and uploads a
# candidate in cells, by hand. Its tests run with the others in osm-data.yml.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install polku-lipas and its .htaccess once, or copy LIPAS and upload the candidate
        type: choice
        options: [install-hosting, copy]
        default: copy

permissions:
  contents: read

concurrency:
  group: lipas-data
  cancel-in-progress: false

jobs:
  host:
    if: inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-lipas and its .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/lipas.py install-hosting

  copy:
    if: inputs.operation == 'copy'
    runs-on: ubuntu-24.04
    # About 40 pages took 82 s on 2026-11-24 and the build 20 s; uploading about 70 MB and reading it back, minutes
    timeout-minutes: 60
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Fetch each type page by page
        run: python tools/osm_data/lipas.py fetch release
      - name: Build the release from the fetched features
        run: python tools/osm_data/lipas.py build release
      - name: Upload the release in cells and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_CELLS: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/lipas.py upload release
