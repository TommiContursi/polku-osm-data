name: Polku routing data
run-name: Routing data / ${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.event.schedule == '43 5 * * 3' && 'update' || 'check' }}

# Mirrors brouter.de's routing data by its change files and uploads a candidate that Polku promotes (#7).
on:
  schedule:
    # Wednesdays: after brouter.de's nightly build, and away from the OSM upload on Mondays
    - cron: '43 5 * * 3'
    - cron: '43 7 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Install the routing folder's .htaccess, download our first copy, update it, or check the candidate
        type: choice
        options: [install-hosting, initial, update, check]
        default: check

permissions:
  contents: read

concurrency:
  group: routing-data
  cancel-in-progress: false

jobs:
  host:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-routing's .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/routing.py install-hosting

  mirror:
    if: github.event.schedule == '43 5 * * 3' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'initial' || inputs.operation == 'update'))
    runs-on: ubuntu-24.04
    # The world's 10.1 GB at 16 Mbit/s is about 85 minutes, then uploaded and read back; a stopped run resumes
    timeout-minutes: 350
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: BRouter 1.7.10's own release, pinned
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 30 --max-time 300 -o brouter.zip https://github.com/abrensch/brouter/releases/download/v1.7.10/brouter-1.7.10.zip
          echo '023fec3ba997758e8cd7ab9e1bae52e962af3f00b57683e3de86b84ffad01532  brouter.zip' | sha256sum --check
          unzip -q -j brouter.zip brouter-1.7.10/brouter-1.7.10-all.jar -d brouter
          java -version
          df -h .
      - name: Update every square from brouter.de's change files and upload the candidate
        env:
          INITIAL: ${{ inputs.operation == 'initial' && '--initial' || '' }}
          OSM_ALLOW_PUBLISH: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/routing.py mirror --jar brouter/brouter-1.7.10-all.jar $INITIAL

  check:
    if: (github.event.schedule == '43 7 * * *' && vars.OSM_PUBLIC_URL != '') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Freshness and Range reads of the candidate, and of the live release once Polku promotes one
        env:
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/routing.py check "${OSM_PUBLIC_URL%/polku-osm}/polku-routing"
