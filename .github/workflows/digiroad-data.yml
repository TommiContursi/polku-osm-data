name: Polku Digiroad
run-name: Digiroad / ${{ inputs.operation }}

# Copies four Digiroad layers (busy roads, paved roads, private roads and speed limits), by hand, into PMTiles beside
# the features as served, and uploads a candidate in cells. Its source stopped updating on 2026-09-18, so the copy runs
# again only when a newer source exists. Its tests run with the others in osm-data.yml.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install polku-digiroad and its .htaccess once, or copy the four layers and upload the candidate
        type: choice
        options: [install-hosting, copy]
        default: copy
      fetched:
        description: An earlier copy run's ID to build and upload from the features it fetched, or live for the live release's, instead of fetching again
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: digiroad-data
  cancel-in-progress: false

jobs:
  host:
    if: inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-digiroad and its .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/digiroad.py install-hosting

  copy:
    if: inputs.operation == 'copy'
    runs-on: ubuntu-24.04
    # About 530 pages take about 2.5 hours with the 5 s pauses, and a page of private roads takes up to 32 s to answer.
    # The build takes about 10 minutes, and uploading about 1 GB and reading it back up to an hour.
    timeout-minutes: 300
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Fetch the four layers page by page
        if: inputs.fetched == ''
        run: python tools/osm_data/digiroad.py fetch release
      - name: Keep the fetched features, for a later run to build from
        if: inputs.fetched == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: digiroad-features
          path: release/*.jsonl.xz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: The live release's features, from the host
        if: inputs.fetched == 'live'
        env:
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/digiroad.py live release
      - name: The features an earlier run fetched
        if: inputs.fetched != '' && inputs.fetched != 'live'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: digiroad-features
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fetched }}
      - name: Build the release from the fetched features
        run: python tools/osm_data/digiroad.py build release
      - name: Upload the release in cells and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_CELLS: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/digiroad.py upload release
