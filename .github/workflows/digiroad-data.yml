name: Polku Digiroad traffic volumes
run-name: Digiroad / ${{ inputs.operation }}

# Copies Digiroad's busy roads, by hand, into PMTiles and uploads a candidate in cells. Its source stopped updating on
# 2026-09-18, so the copy runs again only when a newer source exists. Its tests run with the others in osm-data.yml.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install polku-digiroad and its .htaccess once, or copy the busy roads and upload the candidate
        type: choice
        options: [install-hosting, copy]
        default: copy

permissions:
  contents: read

concurrency:
  group: digiroad-data
  cancel-in-progress: false

jobs:
  host:
    if: inputs.operation == 'install-hosting'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned SFTP dependency
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Put polku-digiroad and its .htaccess in place once
        env:
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/digiroad.py install-hosting

  copy:
    if: inputs.operation == 'copy'
    runs-on: ubuntu-24.04
    # The fetch is about 3 minutes, the upload of about 20 cells a few more
    timeout-minutes: 30
    environment: osm-data-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r tools/osm_data/sftp-requirements.txt
      - name: Fetch the busy roads page by page and build the release
        run: python tools/osm_data/digiroad.py build release
      - name: Upload the release in cells and name the candidate
        env:
          OSM_ALLOW_PUBLISH: 'true'
          OSM_CELLS: 'true'
          OSM_FTP_HOST: ${{ secrets.OSM_FTP_HOST }}
          OSM_FTP_USER: ${{ secrets.OSM_FTP_USER }}
          OSM_FTP_PASSWORD: ${{ secrets.OSM_FTP_PASSWORD }}
          OSM_SFTP_HOST_KEY_SHA256: ${{ secrets.OSM_SFTP_HOST_KEY_SHA256 }}
          OSM_FTP_ROOT: ${{ vars.OSM_FTP_ROOT }}
          OSM_PUBLIC_URL: ${{ vars.OSM_PUBLIC_URL }}
        run: python tools/osm_data/digiroad.py upload release
